name: forecast-mae
phase: forecast

target:
  _target_: src.model.trainer_forecast.Trainer
  dim: 128
  historical_steps: 50
  future_steps: 60
  encoder_depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: False
  drop_path: 0.2
  num_modes: 6
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
  drift_weight: 1.0
  l1_weight: 1.0
  diversity_weight: 0.1
  diversity_sigma: 2.0
  gmn_path:
  gmn_sampling: query_aligned
  gmn_std_scale: 1.0
  gmn_min_std: 0.001
  gmn_latent_dim: 16
  gmn_temperature: 1.0
