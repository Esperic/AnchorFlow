name: forecast-mae
phase: forecast

target:
  _target_: src.model.trainer_forecast.Trainer
  dim: 128
  historical_steps: 50
  future_steps: 60
  encoder_depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: False
  drop_path: 0.2
  pretrained_weights: ${pretrained_weights}
  lr: ${lr}
  weight_decay: ${weight_decay}
  epochs: ${epochs}
  warmup_epochs: ${warmup_epochs}
  use_mrgd: ${use_mrgd}
  mrgd_route_grad: ${mrgd_route_grad}
  mrgd_warmup_epochs: ${mrgd_warmup_epochs}
  mrgd_residual_scale: ${mrgd_residual_scale}
  mrgd_consensus: ${mrgd_consensus}
  mrgd_log_interval: ${mrgd_log_interval}
  gradient_clip_val: ${gradient_clip_val}
  gradient_clip_algorithm: ${gradient_clip_algorithm}
