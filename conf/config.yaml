defaults:
  - hydra: default
  - datamodule: av2
  - model: model_forecast

seed: 2333
monitor: ${model.monitor}
save_top_k: 10

data_root:
checkpoint:
pretrained_weights:
output: ${model.name}-${model.phase}

# trainer
num_workers: 8
gpus: 1
sync_bn: true
batch_size: 32
epochs: 60
warmup_epochs: 10

# optimizer
lr: 0.001
weight_decay: 1e-4
head_lr_scale: 3.3333333333333335
fde_loss_weight: 0.5
cls_temperature: 1.0
mr_loss_weight: 0.1
other_loss_weight: 0.25
miss_threshold: 2.0
probability_temperature: 1.0
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

wandb: disable
