defaults:
  - hydra: default
  - datamodule: av2
  - model: model_forecast

seed: 2333
monitor: val_minFDE6
save_top_k: 10

data_root:
checkpoint:
pretrained_weights:
output: ${model.name}-${model.phase}

# trainer
num_workers: 8
gpus: 1
sync_bn: true
batch_size: 32
epochs: 60
warmup_epochs: 10
use_mrgd: false
mrgd_route_grad: true
mrgd_warmup_epochs: 5
mrgd_residual_scale: 1.0
mrgd_consensus: mean
mrgd_log_interval: 50
mrgd_count_weight_private: true
mrgd_freeze_delta_warmup: true

# optimizer
lr: 0.001
weight_decay: 1e-4
gradient_clip_val: 5
gradient_clip_algorithm: norm

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: false

wandb: disable
